<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Habit Tracker - Atomic Daily Loops & Identity-Based Habit Tracker" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <title>Habit Tracker — Atomic Daily Loops</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f8fafc;
        overflow-x: hidden;
      }
      .app-loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      .loading-badge {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid #cbd5e1;
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 14px;
      }
      .loading-title {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #0284c7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loading-sub {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading-screen">
        <div class="loading-badge">
          <svg width="48" height="48" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="initGrid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#e2e8f0" stroke-width="0.75" />
                <line x1="0" y1="0" x2="6" y2="0" stroke="#e2e8f0" stroke-width="0.75" />
              </pattern>
              <linearGradient id="initBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa" />
                <stop offset="50%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
            </defs>
            <circle cx="28" cy="28" r="28" fill="#ffffff" />
            <circle cx="28" cy="28" r="27" fill="url(#initGrid)" opacity="0.8" />
            <g>
              <polygon points="17.5,22.1 14.7,25.2 21.2,31.7 18.4,35.1 21.2,37.6 24.3,34.8 31.1,41.3 33.9,38.5" fill="url(#initBlue)" />
              <polygon points="24.0,15.6 21.2,18.4 37.6,34.8 40.4,31.7 33.9,25.2 40.7,18.4 37.6,15.3 30.8,22.1" fill="url(#initBlue)" />
            </g>
          </svg>
        </div>
        <div class="loading-title">Habit Tracker</div>
        <div class="loading-sub">Atomic Daily Loops</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
