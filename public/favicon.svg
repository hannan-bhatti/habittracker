<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <pattern
      id="favGridPattern"
      width="6"
      height="6"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45 0 0)"
    >
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e2e8f0" stroke-width="0.75" />
      <line x1="0" y1="0" x2="6" y2="0" stroke="#e2e8f0" stroke-width="0.75" />
    </pattern>
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Circular Badge -->
  <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <circle cx="28" cy="28" r="25.4" fill="url(#favGridPattern)" opacity="0.8" />

  <!-- Dual-T Geometric Monogram -->
  <polygon
    points="17.5,22.1 14.7,25.2 21.2,31.7 18.4,35.1 21.2,37.6 24.3,34.8 31.1,41.3 33.9,38.5"
    fill="url(#favBlueGrad)"
  />
  <polygon
    points="24.0,15.6 21.2,18.4 37.6,34.8 40.4,31.7 33.9,25.2 40.7,18.4 37.6,15.3 30.8,22.1"
    fill="url(#favBlueGrad)"
  />
</svg>